[project]
name = "brick-buddy-backend"
version = "1.0.0"
description = "Brick Buddy API: Claude + LDraw Nova brick models for a 3-year-old builder"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "anthropic>=1.10,<2",
  "pillow>=11",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.uv]
package = false
